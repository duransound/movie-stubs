<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- grungy ink-stamp distress filter -->
    <filter id="inkDistress" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.022" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feComponentTransfer in="displaced" result="fade">
        <feFuncA type="gamma" amplitude="1" exponent="0.85" offset="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="inkDistressSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.03" numOctaves="2" seed="3" result="noise2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise2" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <path id="topArc" d="M 46,205 A 154,154 0 0 1 354,205" fill="none"/>
    <path id="bottomArc" d="M 46,215 A 154,154 0 0 0 354,215" fill="none"/>
  </defs>

  <g transform="rotate(-4 200 200)" filter="url(#inkDistress)">
    <g fill="none" stroke="#16213B" stroke-linecap="round">
      <circle cx="200" cy="200" r="178" stroke-width="6"/>
      <circle cx="200" cy="200" r="166" stroke-width="2.5"/>
      <circle cx="200" cy="200" r="118" stroke-width="2.5"/>
    </g>

    <!-- decorative ticks around outer ring -->
    <g stroke="#16213B" stroke-width="2.5" stroke-linecap="round">
      <line x1="200" y1="22" x2="200" y2="34"/>
      <line x1="200" y1="366" x2="200" y2="378"/>
      <line x1="22" y1="200" x2="34" y2="200"/>
      <line x1="366" y1="200" x2="378" y2="200"/>
    </g>

    <!-- small stars flanking the arc text -->
    <text x="200" y="238" text-anchor="middle" font-family="Special Elite, monospace" font-size="15" fill="#16213B">&#10022;</text>

    <text font-family="Special Elite, monospace" font-size="19" letter-spacing="4" fill="#16213B">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">MOLLIE &amp; IAN</textPath>
    </text>
    <text font-family="Special Elite, monospace" font-size="17" letter-spacing="6" fill="#16213B">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">MOVIE STUB</textPath>
    </text>

    <!-- interlocking monogram -->
    <g font-family="Bitter, Georgia, serif" font-weight="900" fill="#16213B">
      <text x="163" y="228" font-size="130" text-anchor="middle">M</text>
      <text x="233" y="228" font-size="130" text-anchor="middle" opacity="0.98">I</text>
    </g>
    <rect x="150" y="150" width="6" height="100" fill="#16213B" opacity="0"/>
  </g>
</svg>