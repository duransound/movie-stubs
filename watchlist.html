<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming attractions — Two-Person Picture Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=VT323&family=Press+Start+2P&family=Cinzel:wght@500;700&family=Alfa+Slab+One&family=Original+Surfer&family=Righteous&family=Bebas+Neue&family=Libre+Barcode+39&family=Pacifico&family=Special+Elite&family=Courier+Prime:wght@400;700&family=Space+Mono:wght@400;700&family=Overpass+Mono:wght@400;600&family=Crimson+Text&family=Lora:ital@0;1&family=Jost:wght@400;500&family=Nunito&family=Share+Tech+Mono&family=Anonymous+Pro&family=Work+Sans:wght@400;500;600&family=Audiowide&family=Chakra+Petch&family=Barlow+Condensed:wght@400;500;600&family=Marcellus&family=IM+Fell+French+Canon&family=Vollkorn:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="logo/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="logo/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
<script src="theme.js"></script>
</head>
<body>

  <header class="masthead">
    <div class="masthead-inner">
      <p class="eyebrow">Coming soon</p>
      <h1 class="title">Coming Attractions</h1>
      <p class="subtitle">The queue — movies we haven't watched together yet.</p>
      <nav class="masthead-nav">
        <a href="index.html">&larr; Back to the wall</a>
        <a href="add.html">+ Add a ticket</a>
        <a href="stats.html">Box Office Report</a>
      </nav>
      <div class="theme-picker">
        <label for="theme-select">Style</label>
        <select id="theme-select" aria-label="Ticket style"></select>
      </div>
    </div>
  </header>

  <main class="wrap">

    <form class="form-card" id="watch-add-form">
      <div class="form-row">
        <label for="watch-title">Title</label>
        <input type="text" id="watch-title" placeholder="Poor Things" />
        <div class="lookup-row">
          <button type="button" class="btn secondary" id="watch-lookup-btn" style="color: var(--text-on-paper); border-color: var(--paper-shadow);">Look up</button>
          <span class="lookup-status" id="watch-lookup-status"></span>
        </div>
        <div class="lookup-results" id="watch-lookup-results" hidden></div>
      </div>

      <div class="form-row">
        <label for="watch-year">Year</label>
        <input type="number" id="watch-year" placeholder="2023" />
      </div>

      <p class="form-error" id="watch-form-error" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn" id="watch-add-btn">Add</button>
      </div>

      <p class="publish-status" id="watch-publish-status"></p>
    </form>

    <div class="stats watch-stats-standalone" id="watch-stats" aria-live="polite" style="margin-top: 2.5rem;"></div>

    <section id="watch-grid" class="grid watch-grid" aria-label="Movies we want to see"></section>

    <p id="watch-empty-state" class="empty-state" hidden>Nothing on the list yet — pitch one above.</p>

  </main>

  <script src="config.public.js"></script>
  <script src="watchlist.js"></script>
</body>
</html>
