<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add a ticket — Two-Person Picture Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=VT323&family=Press+Start+2P&family=Cinzel:wght@500;700&family=Alfa+Slab+One&family=Original+Surfer&family=Righteous&family=Bebas+Neue&family=Libre+Barcode+39&family=Pacifico&family=Special+Elite&family=Courier+Prime:wght@400;700&family=Space+Mono:wght@400;700&family=Overpass+Mono:wght@400;600&family=Crimson+Text&family=Lora:ital@0;1&family=Jost:wght@400;500&family=Nunito&family=Share+Tech+Mono&family=Anonymous+Pro&family=Work+Sans:wght@400;500;600&family=Audiowide&family=Chakra+Petch&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="logo/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="logo/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
<script src="theme.js"></script>
</head>
<body>

  <header class="masthead">
    <div class="masthead-inner">
      <p class="eyebrow">Box office</p>
      <h1 class="title">Add a ticket</h1>
      <p class="subtitle">Fill this out after you watch something — hitting Add commits it straight to GitHub.</p>
      <nav class="masthead-nav">
        <a href="index.html">&larr; Back to the wall</a>
        <a href="watchlist.html">Coming attractions</a>
        <a href="stats.html">Box Office Report</a>
      </nav>
      <div class="theme-picker">
        <label for="theme-select">Style</label>
        <select id="theme-select" aria-label="Ticket style"></select>
      </div>
    </div>
  </header>

  <main class="wrap">

    <p class="helper-text">
      Fill this out after you watch something, then hit <strong>Add</strong> —
      it commits straight to <code>data/movies.json</code> on GitHub.
    </p>

    <form class="form-card" id="ticket-form">
      <div class="form-row">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Paddington 2" />
        <div class="lookup-row">
          <button type="button" class="btn secondary" id="lookup-btn" style="color: var(--text-on-paper); border-color: var(--paper-shadow);">Look up</button>
          <span class="lookup-status" id="lookup-status"></span>
        </div>
        <div class="lookup-results" id="lookup-results" hidden></div>
        <img class="poster-preview" id="poster-preview" hidden alt="Poster preview" />
      </div>

      <div class="form-cols">
        <div class="form-row">
          <label for="year">Year</label>
          <input type="number" id="year" placeholder="2017" />
        </div>
        <div class="form-row">
          <label for="watchedDate">Date watched</label>
          <input type="date" id="watchedDate" />
        </div>
      </div>

      <div class="form-row">
        <label for="venue">Venue (optional)</label>
        <input type="text" id="venue" placeholder="Couch, blanket fort" />
      </div>

      <div class="form-row">
        <label>Mollie's rating</label>
        <div class="star-input" data-rater="mollie">
          <span class="star-track"></span>
          <span class="rating-readout">0.0</span>
        </div>
      </div>

      <div class="form-row">
        <label>Ian's rating</label>
        <div class="star-input" data-rater="ian">
          <span class="star-track"></span>
          <span class="rating-readout">0.0</span>
        </div>
      </div>

      <div class="form-row">
        <label for="note">Note (optional)</label>
        <textarea id="note" placeholder="One line you'll want to remember about the night."></textarea>
      </div>

      <p class="form-error" id="form-error" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn" id="add-btn">Add</button>
      </div>

      <p class="publish-status" id="publish-status"></p>
    </form>

  </main>


  <script src="config.public.js"></script>
  <script src="add.js"></script>
</body>
</html>
